name: subjective_study
description: Offline subjective evaluation platform with versioned 2AFC experiments.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.7
  crypto: ^3.0.6
  file_picker: ^10.3.10
  image: ^4.5.4
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/demo.study.zip
    - assets/generic.demo.zip
